name: Bug report
description: Something in win-disk-doctor does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead? Remove user names and personal paths.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: Output of `win-disk-doctor --version`, your Python version and Windows version.
    validations:
      required: true
